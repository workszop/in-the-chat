/* ============================================================
   edulab – Colors & Type foundation
   Fonts loaded from Google Fonts (CDN). See README "Visual
   Foundations" for substitution notes.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper – page background is white; the sand steps are wells/alternating sections */
  --paper:    #FFFFFF;   /* page background (white)    */
  --paper-2:  #FBF7E6;   /* alternating section        */
  --paper-3:  #F5EDCB;   /* deepest sand / wells       */
  --surface:  #FFFFFF;   /* cards & sheets             */

  /* Ink – warm near-black text & lines */
  --ink:      #1C1917;   /* primary text               */
  --ink-2:    #57534E;   /* secondary text             */
  --ink-3:    #948C82;   /* muted / placeholder        */
  --line:     #EDE7D2;   /* hairline borders           */
  --line-2:   #DDD4B6;   /* stronger borders           */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. A "-soft" tint IS the saturated colour
     (panels and chips are solid), "-ink" is the text colour ON it:
     white on blue/green/red, dark ink on yellow. Never colour-on-colour
     (no green text on green); the saturated colour itself goes only on
     white or black. */

  /* Yellow – primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue – secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #1E8FC2;
  --blue-ink:  #FFFFFF;

  /* Green – secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #009444;
  --green-soft: #00A651;
  --green-ink:  #FFFFFF;

  /* Red – danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #E5322D;
  --red-ink:  #FFFFFF;

  /* Legacy role aliases – older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette – subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #00A651;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #E5322D;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #1E8FC2;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation – warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   ============================================================ */

.edu-display, .edu h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.edu h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
.edu h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
.edu h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
.edu h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
.edu p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline – mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
.edu code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

/* ─── App tokens ─── */
:root {
  --app-width: 1100px;
  --app-index-width: 230px;
  --app-header-height: 81px;
  --app-page-title: clamp(2rem, 4.5vw, 2.85rem);
  --app-lesson-title: clamp(1.75rem, 3vw, 2.3rem);
  --app-section-title: 1.35rem;
  --app-example-title: 1.125rem;
  --app-example-type: 1rem;
  --app-wordmark-type: 22px;
  --app-number-type: 2.5rem;
  --app-stat-type: 2.5rem;
  --app-nav-type: 14px;
  --app-button-type: 15px;
  --app-title-weight: 700;
  --app-strong-weight: 600;
  --app-body-leading: 1.65;
  --app-title-leading: 1.12;
  --app-tight-leading: 1.4;
  --app-title-tracking: -.025em;
  --app-mono-tracking: .02em;
  --app-body-align: start;
  --app-hero-align: center;
  --app-functional-align: center;
  --app-end-align: end;
  --app-header-bg: color-mix(in srgb, var(--paper) 90%, transparent);
  --app-dialog-backdrop: color-mix(in srgb, var(--ink) 30%, transparent);
  --app-clear: transparent;
  --app-selected: var(--blue-600);
  --app-selected-ink: var(--blue-ink);
  --app-focus: var(--ink);
  --app-focus-size: 2px;
  --app-rule: 1px;
  --app-touch: 44px;
  --app-logo-width: 64px;
  --app-logo-gap: -6px;
  --app-nav-number: 25px;
  --app-answer-number: 30px;
  --app-progress-height: 7px;
  --app-index-top: 105px;
  --app-header-blur: 12px;
  --app-duration: 160ms;
  --app-badge: 32px;
  --app-chip-type: 11px;
  --app-chip-tracking: .08em;
}

/* ─── Foundation ─── */
* { box-sizing: border-box; }
html { scroll-padding-top: var(--app-index-top); }
body { margin: 0; text-align: var(--app-body-align); }
button, input, textarea, select { font: inherit; }
button, a, summary { -webkit-tap-highlight-color: var(--app-clear); }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, a { touch-action: manipulation; }
button:focus-visible, a:focus-visible, summary:focus-visible, textarea:focus-visible { outline: var(--app-focus-size) solid var(--app-focus); outline-offset: var(--sp-1); box-shadow: var(--focus-ring); }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-underline-offset: var(--sp-1); }
.edu p { line-height: var(--app-body-leading); }
.edu strong { font-weight: var(--app-strong-weight); color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 100; top: var(--sp-3); left: var(--sp-4); transform: translateY(-200%); padding: var(--sp-3) var(--sp-5); background: var(--yellow); border-radius: var(--r-pill); color: var(--yellow-ink); font-size: var(--body); }
.skip-link:focus { transform: translateY(0); }
.edu-header { position: sticky; top: 0; z-index: 40; width: 100%; background: var(--app-header-bg); backdrop-filter: blur(var(--app-header-blur)); -webkit-backdrop-filter: blur(var(--app-header-blur)); border-bottom: var(--app-rule) solid var(--line); }
.edu-header-inner { max-width: var(--app-width); margin: 0 auto; padding: var(--sp-2) var(--sp-6); display: flex; align-items: center; gap: var(--sp-3); }
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
.edu-logo { width: var(--app-logo-width); height: var(--app-logo-width); display: block; margin-right: var(--app-logo-gap); }
.edu-wordmark { font-family: var(--font-display); font-weight: var(--app-title-weight); font-size: var(--app-wordmark-type); letter-spacing: var(--app-title-tracking); color: var(--ink); }
.header-tools { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-3); }
.language-switch { display: inline-flex; gap: var(--sp-1); padding: var(--sp-1); background: var(--paper-2); border: 0; border-radius: var(--r-pill); }
.language-switch button { min-height: var(--app-touch); padding: var(--sp-2) var(--sp-4); border: 0; border-radius: var(--r-pill); background: var(--app-clear); color: var(--ink-2); font-size: var(--body-sm); font-weight: var(--app-strong-weight); }
.language-switch button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: var(--app-touch); padding: var(--sp-3) var(--sp-5); border: var(--app-rule) solid var(--line-2); border-radius: var(--r-pill); font-family: var(--font-display); font-size: var(--app-button-type); font-weight: var(--app-strong-weight); line-height: var(--app-tight-leading); background: var(--surface); color: var(--ink); text-align: var(--app-functional-align); text-decoration: none; transition: background var(--app-duration), border-color var(--app-duration); }
.button:hover:not(:disabled) { background: var(--paper-2); border-color: var(--ink-2); }
.button.primary { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); box-shadow: var(--shadow-sm); }
.button.primary:hover:not(:disabled) { background: var(--yellow-600); border-color: var(--yellow-600); }
.button.quiet { background: var(--app-clear); border-color: var(--app-clear); box-shadow: none; }
.button.quiet:hover:not(:disabled) { background: var(--paper-2); border-color: var(--app-clear); }
.button:disabled { color: var(--ink-2); background: var(--paper-2); border-color: var(--line); box-shadow: none; }

/* ─── Page and chapter index ─── */
.app-shell { max-width: var(--app-width); margin: 0 auto; padding: var(--sp-12) var(--sp-6) var(--sp-16); }
.page-header { text-align: var(--app-hero-align); }
.edu h1.app-title { font-family: var(--font-display); font-size: var(--app-page-title); font-weight: 800; letter-spacing: var(--app-title-tracking); line-height: var(--app-title-leading); color: var(--ink); }
.edu p.edu-lead { width: 100%; max-width: none; font-size: var(--body-lg); color: var(--ink-2); margin-top: var(--sp-5); }
.course-progress { margin: var(--sp-10) 0 var(--sp-10); }
.progress-copy { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.progress-copy span { font-size: var(--body-sm); color: var(--ink-2); }
.progress-copy strong { font-family: var(--font-mono); font-size: var(--caption); font-weight: 500; color: var(--ink); }
progress { width: 100%; height: var(--app-progress-height); display: block; appearance: none; border: 0; border-radius: var(--r-pill); overflow: hidden; background: var(--paper-3); color: var(--yellow); }
progress::-webkit-progress-bar { background: var(--paper-3); border-radius: var(--r-pill); }
progress::-webkit-progress-value { background: var(--yellow); border-radius: var(--r-pill); }
progress::-moz-progress-bar { background: var(--yellow); border-radius: var(--r-pill); }
.saving-notice { margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: var(--body-sm); background: var(--yellow); color: var(--yellow-ink); }
.course-layout { display: grid; grid-template-columns: var(--app-index-width) minmax(0, 1fr); gap: var(--sp-10); align-items: start; }
.chapter-index { position: sticky; top: var(--app-index-top); max-height: calc(100dvh - var(--app-index-top) - var(--sp-6)); overflow-y: auto; scrollbar-width: thin; padding: var(--sp-1); margin: calc(-1 * var(--sp-1)); }
.edu h2.index-title { font-size: var(--app-section-title); margin: 0 0 var(--sp-4) var(--sp-3); }
.mobile-index-toggle { display: none; }
.chapter-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-1); }
.chapter-link { display: flex; align-items: center; width: 100%; min-height: var(--app-touch); gap: var(--sp-2); border: 0; border-radius: var(--r-pill); padding: var(--sp-3); background: var(--app-clear); color: var(--ink-2); text-align: var(--app-body-align); font-size: var(--app-nav-type); line-height: var(--app-tight-leading); transition: background var(--app-duration); }
.chapter-link:hover { background: var(--paper-2); }
.chapter-link[aria-current="step"] { background: var(--yellow); color: var(--yellow-ink); font-weight: var(--app-strong-weight); }
.chapter-number { flex: 0 0 var(--app-nav-number); font-family: var(--font-mono); font-size: var(--caption); }
.chapter-name { flex: 1; }
.chapter-done { color: var(--ink); font-weight: var(--app-title-weight); }
.index-footnote { margin: var(--sp-5) var(--sp-3) 0; font-size: var(--caption); color: var(--ink-2); line-height: var(--app-tight-leading); }
.lesson-workspace { min-width: 0; }
.lesson-heading { margin-bottom: var(--sp-8); }
.edu h2.lesson-title { font-size: var(--app-lesson-title); line-height: var(--app-title-leading); letter-spacing: var(--app-title-tracking); outline: none; }
.lesson-intro { margin-top: var(--sp-4); font-size: var(--body-lg) !important; }

/* ─── Lesson content ─── */
.example { padding: var(--sp-6); border-radius: var(--r-xl); background: var(--paper-2); margin-bottom: var(--sp-8); border: var(--app-rule) solid var(--line); }
.edu h3.example-title { font-size: var(--app-section-title); margin-bottom: var(--sp-5); }
.example-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.example-piece { min-width: 0; background: var(--surface); padding: var(--sp-5); border: var(--app-rule) solid var(--line); border-radius: var(--r-lg); }
.edu h4.example-label { font-family: var(--font-display); font-size: var(--app-example-title); font-weight: var(--app-strong-weight); line-height: var(--app-tight-leading); margin-bottom: var(--sp-3); }
.edu p.example-copy { color: var(--ink); font-size: var(--app-example-type); white-space: pre-line; overflow-wrap: anywhere; }
.example-note { margin-top: var(--sp-4); font-size: var(--body-sm) !important; }
.example-stack .example-grid { grid-template-columns: minmax(0,1fr); }
.token-flow { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: var(--sp-5) 0; }
.token { padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-family: var(--font-mono); font-size: var(--app-example-title); background: var(--surface); color: var(--ink); border: var(--app-rule) solid var(--line-2); }
.token:nth-child(2n) { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.token strong { text-decoration: underline; text-underline-offset: var(--sp-1); }
.token-flow-note { font-family: var(--font-mono) !important; font-size: var(--body-sm) !important; color: var(--ink) !important; margin-bottom: var(--sp-5); }
.probabilities { margin: var(--sp-5) 0; display: grid; gap: var(--sp-3); }
.probability-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: var(--sp-3); align-items: center; font-family: var(--font-mono); font-size: var(--caption); color: var(--ink); }
.probability-row progress { height: var(--sp-2); }
.lesson-section { margin: var(--sp-8) 0; display: grid; grid-template-columns: var(--app-badge) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.section-number, .recap-number { display: flex; align-items: center; justify-content: center; width: var(--app-badge); height: var(--app-badge); background: var(--blue-soft); color: var(--blue-ink); border-radius: var(--r-pill); font-family: var(--font-mono); font-size: var(--caption); font-weight: 500; }
.edu h3.section-title { font-size: var(--app-section-title); line-height: var(--app-tight-leading); margin-bottom: var(--sp-3); }
.lesson-section p + p { margin-top: var(--sp-3); }
.source-link { display: inline-block; margin-top: var(--sp-3); font-size: var(--body-sm); }
.takeaway { padding: var(--sp-6); margin: var(--sp-8) 0 var(--sp-5); border-radius: var(--r-lg); background: var(--yellow); color: var(--yellow-ink); }
.edu .takeaway h3 { font-size: var(--app-section-title); margin-bottom: var(--sp-3); color: inherit; }
.edu .takeaway p { color: inherit; }
.caveat { color: var(--ink-2); font-size: var(--body-sm) !important; }
.caveat strong { color: var(--ink); }
.recap-list { list-style: none; padding: 0; margin: var(--sp-8) 0; display: grid; gap: var(--sp-5); }
.recap-item { display: grid; grid-template-columns: var(--app-badge) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.edu .recap-item h3 { font-size: var(--app-section-title); margin-bottom: var(--sp-2); }

/* ─── Knowledge checks ─── */
.knowledge-check { margin-top: var(--sp-10); }
.quiz-head { padding: var(--sp-6) var(--sp-8); border-radius: var(--r-xl); background: var(--blue-soft); color: var(--blue-ink); }
.edu .knowledge-check h3 { font-size: var(--h3); }
.quiz-intro { margin-top: var(--sp-3); }
.question { margin-top: var(--sp-6); padding: var(--sp-6); border: var(--app-rule) solid var(--line); border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-sm); }
.question-number { display: inline-flex; align-items: center; padding: var(--sp-1) var(--sp-3); margin-bottom: var(--sp-3); border-radius: var(--r-pill); background: var(--blue-soft); color: var(--blue-ink); font-family: var(--font-mono); font-size: var(--app-chip-type); font-weight: 500; letter-spacing: var(--app-chip-tracking); text-transform: uppercase; }
.edu h4.question-title { font-family: var(--font-sans); font-size: var(--body-lg); line-height: var(--app-tight-leading); margin-bottom: var(--sp-5); }
.answer-list { display: grid; gap: var(--sp-2); }
.answer { width: 100%; min-height: var(--app-touch); display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: var(--app-rule) solid var(--line-2); border-radius: var(--r-md); color: var(--ink); background: var(--surface); text-align: var(--app-body-align); font-size: var(--body); line-height: var(--app-tight-leading); transition: background var(--app-duration); }
.answer:hover:not(:disabled) { background: var(--paper-2); border-color: var(--ink-2); }
.answer-number { display: flex; flex: 0 0 var(--app-answer-number); width: var(--app-answer-number); min-height: var(--app-answer-number); justify-content: center; align-items: center; font-family: var(--font-mono); font-size: var(--caption); border-radius: var(--r-xs); background: var(--paper-2); color: var(--ink); }
.answer-label { flex: 1; min-width: 0; }
.answer-status { display: block; font-size: var(--caption); font-weight: var(--app-strong-weight); margin-top: var(--sp-1); }
.answer[data-selected="true"][data-correct="true"] { background: var(--app-selected); border-color: var(--app-selected); color: var(--app-selected-ink); }
.answer[data-selected="true"][data-correct="false"] { background: var(--paper-2); border-color: var(--red); color: var(--ink); }
.answer[data-selected="false"][data-correct="true"] { border-color: var(--green); }
.answer[data-selected="true"] .answer-number { background: var(--surface); color: var(--ink); }
.question-feedback { margin-top: var(--sp-4); padding: var(--sp-4); background: var(--paper-2); border-radius: var(--r-md); color: var(--ink); font-size: var(--body-sm); line-height: var(--app-body-leading); }
.retry-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); margin-top: var(--sp-5); }
.retry-note { font-size: var(--caption) !important; }
.reflection { padding: var(--sp-5); border-radius: var(--r-lg); background: var(--paper-2); margin-top: var(--sp-6); }
.reflection > summary { font-family: var(--font-display); font-size: var(--app-example-title); font-weight: var(--app-strong-weight); cursor: pointer; min-height: var(--app-touch); display: list-item; align-content: center; }
.reflection-question { color: var(--ink) !important; margin: var(--sp-3) 0; }
.model-answer summary { min-height: var(--app-touch); align-content: center; font-size: var(--body-sm); cursor: pointer; }
.model-answer p { padding-top: var(--sp-2); }
.lesson-controls { margin-top: var(--sp-10); padding-top: var(--sp-6); border-top: var(--app-rule) solid var(--line); }
.reading-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.reading-row p { font-size: var(--body-sm); flex: 1; min-width: 170px; }
.navigation-row { margin-top: var(--sp-6); display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
.next-button { margin-inline-start: auto; }

/* ─── Results and tools ─── */
.results-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); margin: var(--sp-6) 0; }
.stat-card { padding: var(--sp-6); background: var(--paper-2); border-radius: var(--r-xl); }
.stat-card[data-result="reading"] { background: var(--yellow-soft); color: var(--yellow-ink); }
.stat-card[data-result="quiz"] { background: var(--blue-soft); color: var(--blue-ink); }
.stat-number { display: block; font-family: var(--font-display); font-size: var(--app-stat-type); font-weight: var(--app-title-weight); line-height: var(--app-title-leading); margin-bottom: var(--sp-3); }
.stat-label { font-size: var(--body); line-height: var(--app-tight-leading); }
.result-list { list-style: none; margin: var(--sp-8) 0; padding: 0; display: grid; gap: var(--sp-3); }
.result-item { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5); border: var(--app-rule) solid var(--line); border-radius: var(--r-lg); }
.result-item strong { display: block; font-size: var(--body); margin-bottom: var(--sp-2); }
.result-item small { display: block; color: var(--ink-2); font-size: var(--body-sm); line-height: var(--app-tight-leading); }
.result-item .button { flex: 0 0 auto; }
.app-footer { max-width: var(--app-width); margin: 0 auto; padding: 0 var(--sp-6) var(--sp-8); color: var(--ink-2); }
.footer-inner { border-top: var(--app-rule) solid var(--line); padding-top: var(--sp-6); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-5); }
.footer-copy { flex: 1; }
.edu .footer-copy p { font-size: var(--caption); }
.footer-copy p + p { margin-top: var(--sp-2); }
.footer-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: flex-end; }
.footer-actions .button { font-size: var(--body-sm); padding: var(--sp-2) var(--sp-3); }
kbd { font-family: var(--font-mono); font-size: var(--caption); padding: 0 var(--sp-1); border: var(--app-rule) solid var(--line-2); border-radius: var(--r-xs); color: var(--ink); }
dialog { padding: var(--sp-8); border: var(--app-rule) solid var(--line); border-radius: var(--r-xl); background: var(--surface); color: var(--ink); max-width: min(640px, calc(100vw - var(--sp-8))); max-height: calc(100dvh - var(--sp-10)); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: var(--app-dialog-backdrop); }
.edu dialog h2 { font-size: var(--h3); margin-bottom: var(--sp-4); }
.verify-list { padding: 0; list-style: none; margin: var(--sp-5) 0; display: grid; gap: var(--sp-3); }
.verify-list li { padding: var(--sp-3) var(--sp-4); border: var(--app-rule) solid var(--line); border-radius: var(--r-md); font-size: var(--body-sm); }
.verify-list li[data-pass="false"] { border-color: var(--red); }
.verify-list strong { margin-right: var(--sp-2); }
.verify-list small { display: block; color: var(--ink-2); margin-top: var(--sp-1); font-size: var(--caption); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 768px) {
  :root { --app-lesson-title: 1.8rem; --app-header-height: 81px; --app-example-type: 1rem; }
  .edu-header-inner { padding-inline: var(--sp-4); gap: var(--sp-2); }
  .header-tools { gap: var(--sp-1); }
  .header-results { display: none; }
  .language-switch button { padding-inline: var(--sp-3); }
  .app-shell { padding: var(--sp-8) var(--sp-4) var(--sp-10); }
  .edu p.edu-lead { font-size: var(--body); }
  .course-progress { margin: var(--sp-6) 0; }
  .progress-copy { align-items: start; }
  .progress-copy span { font-size: var(--caption); }
  .progress-copy strong { white-space: nowrap; }
  .course-layout { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); }
  .chapter-index { position: static; max-height: none; overflow: visible; }
  .index-title { display: none; }
  .mobile-index-toggle { display: flex; justify-content: space-between; width: 100%; }
  .chapter-index nav { display: none; margin-top: var(--sp-3); }
  .chapter-index[data-expanded="true"] nav { display: block; }
  .chapter-list { grid-template-columns: minmax(0,1fr); }
  .index-footnote { display: none; }
  .lesson-heading { margin-bottom: var(--sp-6); }
  .lesson-intro { font-size: var(--body) !important; }
  .example { padding: var(--sp-5); }
  .example-grid { grid-template-columns: minmax(0, 1fr); }
  .example-piece { padding: var(--sp-4); }
  .question { padding: var(--sp-5) var(--sp-4); }
  .answer { padding: var(--sp-3); gap: var(--sp-2); }
  .takeaway { padding: var(--sp-5); }
  .quiz-head { padding: var(--sp-5); }
  .lesson-section, .recap-item { gap: var(--sp-3); }
  .reading-row { align-items: stretch; }
  .reading-row .button { width: 100%; }
  .results-stats { gap: var(--sp-3); }
  .stat-card { padding: var(--sp-5); }
  .result-item { padding: var(--sp-4); gap: var(--sp-2); }
  .result-item .button { padding-inline: var(--sp-3); }
  .app-footer { padding-inline: var(--sp-4); }
  .footer-inner { flex-direction: column; }
  .footer-actions { justify-content: flex-start; }
  .shortcuts { display: none; }
  dialog { padding: var(--sp-6); }
}
</style>
</head>

    causalSource: 'Źródło: Attention Is All You Need, sekcja 3.1 (dekoder)',
    c1Nav: 'Aplikacja a model', c1Title: 'Aplikacja czatu to nie model',
    c1Intro: 'Dymki wiadomości, historia i „pamięć” to funkcje aplikacji. Model otrzymuje od niej przygotowany kontekst i przewiduje, jaki fragment tekstu może pojawić się dalej.',
    c1ExampleTitle: 'Dlaczego chatbot „pamięta” Olę?',
    c1Example1Label: 'To, co widzisz w czacie',
    c1Example1: 'Ty: Cześć! Mam na imię Ola.\nAsystent: Miło Cię poznać, Ola!\nTy: Jak mam na imię?',
    c1Example2Label: 'To, co aplikacja wysyła ponownie',
    c1Example2: 'Instrukcja systemowa: Bądź pomocny i zwięzły.\nHistoria: „Mam na imię Ola” + odpowiedź asystenta.\nNowa wiadomość: „Jak mam na imię?”',
    c1ExampleNote: 'Jeśli aplikacja pominie historię i wyśle tylko ostatnie pytanie, w kontekście zabraknie imienia. Ten przykład przygotowano wcześniej, nie wygenerował go model.',
    c1H1: 'Aplikacja przygotowuje zapytanie',
    c1P1: 'Aplikacja przechowuje rozmowę, dodaje prompt systemowy i oznacza role rozmówców zgodnie z szablonem czatu. Może też dołączyć notatki, dokumenty i wyniki narzędzi. Tak przygotowaną sekwencję wysyła do modelu, a potem wyświetla napływającą odpowiedź.',
    c1H2: 'Model przetwarza to, co dostał',
    c1P2: 'W opisywanym tu trybie model nie zapisuje rozmowy w swoich wagach po każdym pytaniu. Wagi to liczby ustalone podczas treningu. Model otrzymuje kontekst, a w jednym kroku oblicza rozkład prawdopodobieństwa kolejnego tokenu. Aplikacja może pamiętać rozmowę, choć sam model nie zachowuje jej między osobnymi wywołaniami.',
    c1H3: 'Ten sam model, inny produkt',
    c1P3: 'Zmiana instrukcji systemowej, historii, narzędzi lub filtrów może zmienić zachowanie aplikacji bez zmiany wag modelu. Na pomocność i bezpieczeństwo odpowiedzi wpływają jednak także trening i dostrajanie modelu. Omówimy je w rozdziale 10.',
    c1Takeaway: 'Chatbot potrafi podać Twoje imię w kolejnej turze, jeśli aplikacja ponownie mu je przekaże. Nie oznacza to, że model nauczył się go podczas rozmowy.',
    c1Caveat: 'Rzeczywiste szablony czatu używają specjalnych tokenów zależnych od modelu, a prompty systemowe bywają znacznie dłuższe. Aplikacja może wysłać tylko część historii lub jej streszczenie.',
    c2Nav: 'Tokenizacja', c2Title: 'Tokenizacja: tekst zamienia się w liczby',
    c2Intro: 'Model przetwarza tokeny, czyli małe fragmenty tekstu. Tokenizator może zachować często używane słowo w całości, inne podzielić na części, a pojedynczy znak zakodować za pomocą kilku fragmentów. Każdy token ma swój numer (ID) w słowniku.',
    c2ExampleTitle: 'Trzy „r”, ale nie trzy osobne tokeny',
    c2Example1Label: 'Ten sam sens, różne języki',
    c2Example1: 'EN: I love programming in Kraków\nPL: Uwielbiam programować w Krakowie\nDE: Ich liebe es, in Krakau zu programmieren',
    c2Example2Label: 'Co warto porównać',
    c2Example2: 'Porównuj liczbę tokenów wybranego modelu, a nie liczbę słów. Ten sam sens zapisany w różnych językach może wymagać różnej liczby tokenów. Wynik zależy też od tokenizatora.',
    c2ExampleNote: 'Podział „str | aw | berr | y” jest poglądowy. Podkreślenia pokazują trzy litery r w słowie strawberry. Nie jest to wynik prawdziwego tokenizatora.',
    c2TokenNote: 'strawberry: 10 liter, 3 × r, tutaj 4 poglądowe fragmenty',
    c2H1: 'ID to numer tokenu',
    c2P1: 'ID to numer przypisany tokenowi w słowniku. Nie określa liczby liter, pozycji w zdaniu ani prawdopodobieństwa. Tokeny o sąsiednich numerach nie muszą mieć podobnego znaczenia. Spacja również może być częścią tokenu; do jej zaznaczenia bywa używany symbol ␣.',
    c2H2: 'Dlaczego język wpływa na koszt',
    c2P2: 'Słownik tokenizatora powstaje na podstawie danych. Jeśli zawiera niewiele fragmentów pasujących do danego języka lub rzadkiego słowa, tekst może wymagać większej liczby tokenów. Polski tekst może mieć ich więcej niż angielski o tym samym znaczeniu, ale różnica zależy od tekstu i tokenizatora. Więcej tokenów może zwiększyć koszt i czas przetwarzania, a także zająć więcej miejsca w kontekście.',
    c2H3: 'Skąd kłopoty z liczeniem liter',
    c2P3: 'Model otrzymuje numery fragmentów tekstu, a nie listę pojedynczych liter. W przykładzie ze słowem strawberry litery r znajdują się wewnątrz kilku tokenów. Może to utrudnić liczenie, ale nie oznacza, że model zawsze się pomyli. Gdy wynik musi być dokładny, sprawdź tekst znak po znaku lub użyj narzędzia.',
    c2Takeaway: 'Token nie musi być słowem ani literą. W tokenach mierzy się długość kontekstu, a często także rozlicza korzystanie z modelu. Sprawdzaj więc tokenizację danego modelu zamiast zgadywać liczbę tokenów na podstawie długości zdania.',
    c2Caveat: 'Ręczny podział nie odtwarza algorytmu BPE ani innego tokenizatora używanego w rzeczywistych systemach. Takie tokenizatory mogą dzielić rzadkie słowa i emoji na mniejsze fragmenty lub bajty. Nie obliczamy tu kosztów API.',
    c3Nav: 'Osadzenia', c3Title: 'Osadzenia: jak zapisać relacje za pomocą liczb',
    c3Intro: 'ID jest tylko etykietą. Model odczytuje z tabeli osadzeń wektor przypisany temu numerowi. Wartości w tabeli powstają podczas treningu. Osadzenie (embedding) pozwala porównywać, łączyć i przekształcać reprezentacje tekstu.',
    c3ExampleTitle: 'Podobieństwo znaczeń, nie kolejność alfabetyczna',
    c3Example1Label: 'Podobne konteksty',
    c3Example1: 'kot ↔ kotek\nkról ↔ królowa\npizza ↔ makaron\n\nSłowa używane w podobnych sytuacjach mogą mieć podobne wektory.',
    c3Example2Label: 'Poglądowa analogia',
    c3Example2: 'król − mężczyzna + kobieta ≈ królowa\n\nKierunek w przestrzeni może odpowiadać relacji między pojęciami.',
    c3ExampleNote: 'Te przykłady pomagają wyobrazić sobie przestrzeń wektorów. Nie pokazują wyników pomiaru konkretnego modelu. Działanie „pizza − chleb + laptop” nie musi dać sensownej analogii.',
    c3H1: 'Relacje między znaczeniami w przestrzeni',
    c3P1: 'Podczas treningu reprezentacje słów powstają na podstawie kontekstów, w których te słowa występują. Wektory mogą być blisko siebie ze względu na podobieństwo znaczeń, a nie pisowni. Do ich porównywania służy m.in. podobieństwo kosinusowe, które określa podobieństwo kierunków. Jego wartość nie jest prawdopodobieństwem, że dwa słowa „znaczą to samo”.',
    c3H2: 'Mapa 2D jest uproszczeniem',
    c3P2: 'Wektory w modelach językowych często mają tysiące wymiarów. Rysunek w dwóch wymiarach nie pokaże wszystkich relacji między nimi. Osie takiej mapy nie są uniwersalnymi osiami „znaczenia”, a to, które wektory leżą blisko siebie, zależy od modelu.',
    c3H3: 'Kontekst zmienia reprezentację',
    c3P3: 'Osadzenie wejściowe to początkowa reprezentacja tokenu. Kolejne warstwy transformera przekształcają ją z uwzględnieniem dostępnego kontekstu. Słowo „zamek” ma tę samą pisownię w otoczeniu słowa „króla” i w wyrażeniu „zamek błyskawiczny”, ale inne znaczenie.',
    c3Takeaway: 'Dzięki osadzeniom można obliczać relacje między fragmentami tekstu. Nie są one słownikiem definicji i nie gwarantują, że każda analogia zadziała.',
    c3Caveat: 'Pary słów i działania na nich służą wyjaśnieniu pojęcia. Nie pokazujemy rzeczywistych współrzędnych, wartości podobieństwa ani warstw modelu. Nie jest to eksperyment z użyciem modelu osadzeń.',
    c4Nav: 'Uwaga', c4Title: 'Uwaga: znaczenie zależy od kontekstu',
    c4Intro: 'Mechanizm uwagi (attention) pozwala uwzględniać inne dostępne tokeny w reprezentacji danego tokenu. W modelu generującym tekst od lewej do prawej są to tylko tokeny z bieżącej i wcześniejszych pozycji.',
    c4ExampleTitle: 'Jedno zakończenie zmienia interpretację',
    c4Example1Label: '… ponieważ on był za duży',
    c4Example1: 'Puchar nie zmieścił się w plecaku, ponieważ on był za duży.\n\nPo przeczytaniu całości rozumiemy: za duży był puchar.',
    c4Example2Label: '… ponieważ on był za mały',
    c4Example2: 'Puchar nie zmieścił się w plecaku, ponieważ on był za mały.\n\nPo przeczytaniu całości rozumiemy: za mały był plecak.',
    c4ExampleNote: 'Porównujemy znaczenie całych zdań. Nie oznacza to, że wcześniejszy token „on” miał dostęp do późniejszego słowa „duży” lub „mały”.',
    c4H1: 'Jak model uwzględnia kontekst',
    c4P1: 'Warstwa uwagi oblicza, jakie informacje z dostępnych reprezentacji połączyć i z jaką wagą. Poszczególne głowy uwagi mogą uwzględniać różne relacje, a kolejne warstwy przetwarzają otrzymany wynik. Mechanizm ten nie sprowadza się do wskazania jednego „najważniejszego” słowa.',
    c4H2: 'Uwaga przyczynowa nie korzysta z późniejszych tokenów',
    c4P2: 'W dekoderze przyczynowym reprezentacja tokenu zależy od niego samego i wcześniejszych tokenów, nie od późniejszych. Zmiana zakończenia zdania nie zmieni więc wstecz reprezentacji wcześniejszego „on”. Gdy model przetwarza już zakończenie i przewiduje dalszy tekst, ma dostęp do większej części zdania.',
    c4H3: 'Wiele warstw i głów uwagi',
    c4P3: 'Model korzysta z wielu głów uwagi w kolejnych warstwach transformera. Uczy się relacji podczas treningu; nie dostaje ręcznie zapisanych reguł interpretacji zaimków. Pojedyncza mapa wag uwagi nie wyjaśnia w pełni, dlaczego model udzielił danej odpowiedzi.',
    c4Takeaway: 'Kontekst pomaga rozstrzygać niejednoznaczności, o ile model ma już do niego dostęp. Model generujący tekst od lewej do prawej nie odczytuje tokenów, które dopiero powstaną.',
    c4Caveat: 'Zdania dobrano do tego przykładu. Nie obliczamy tu wag uwagi. W pierwotnej symulacji również ustalono je ręcznie, zamiast mierzyć w działającym transformerze.',
    c5Nav: 'Generowanie', c5Title: 'Generowanie: jeden token na raz',
    c5Intro: 'Po przetworzeniu kontekstu model oblicza rozkład prawdopodobieństwa kolejnego tokenu. Następnie wybierany jest jeden token, który trafia do tekstu. Model powtarza te obliczenia dla nowego kontekstu. Tak, krok po kroku, powstaje odpowiedź.',
    c5ExampleTitle: '„Kot usiadł na…”',
    c5Example1Label: 'Jeden wybór', c5Example1: 'Kot usiadł na → dywanie\n\nWybieramy jeden z możliwych fragmentów, nie całe zdanie.',
    c5Example2Label: 'Nowy kontekst', c5Example2: 'Kot usiadł na dywanie → …\n\nWybrany token staje się częścią kontekstu w następnym kroku. Proces powtarza się do końca odpowiedzi.',
    c5ExampleNote: 'Wartości ustalono na potrzeby przykładu: dywanie 40%, kanapie 18%, podłodze 15%, parapecie 12%, dachu 9%, klawiaturze 6%. Nie pochodzą z pomiaru rzeczywistego modelu.',
    c5Candidate1: 'dywanie', c5Candidate2: 'kanapie', c5Candidate3: 'podłodze', c5Candidate4: 'parapecie', c5Candidate5: 'dachu', c5Candidate6: 'klawiaturze',
    c5H1: 'Prawdopodobieństwo tokenu a poprawność odpowiedzi',
    c5P1: 'W jednym kroku model oblicza prawdopodobieństwa tokenów ze słownika. Nie tworzy od razu akapitu ani nie potwierdza prawdziwości jego treści. Może przypisać duże prawdopodobieństwo poprawnej kontynuacji „Warszawa jest stolicą Polski”, ale wysoki wynik nie oznacza, że sprawdził źródło.',
    c5H2: 'Co zmienia temperatura',
    c5P2: 'Niższa temperatura wyostrza rozkład, zwiększając przewagę tokenów o wysokim prawdopodobieństwie. Wyższa go spłaszcza, więc częściej mogą zostać wybrane mniej typowe tokeny. Daje to bardziej różnorodne odpowiedzi, ale zwiększa też ryzyko niespójności. Temperatura nie określa prawdziwości odpowiedzi ani inteligencji modelu.',
    c5H3: 'Próbkowanie a wybór zachłanny',
    c5P3: 'Próbkowanie to losowanie tokenu zgodnie z rozkładem prawdopodobieństwa. Wybór zachłanny polega na wybraniu tokenu z najwyższym wynikiem, więc przy tym samym rozkładzie daje ten sam wybór. System może też stosować top-p lub top-k. Generowanie kończy się np. po wybraniu tokenu stopu albo osiągnięciu limitu długości.',
    c5Takeaway: 'Odpowiedź powstaje token po tokenie. Prawdopodobna kontynuacja może zawierać błąd, który model rozwinie w kolejnych krokach, zachowując płynny styl.',
    c5Caveat: 'Pokazujemy sześć tokenów wybranych do przykładu. Rzeczywisty model oblicza wyniki dla całego słownika. Ten schemat nie opisuje wszystkich optymalizacji ani sposobów rozumowania stosowanych we współczesnych systemach.',
    c6Nav: 'Pamięć', c6Title: 'Okno kontekstowe: co zmieści się w rozmowie?',
    c6Intro: 'Okno kontekstowe określa, ile tokenów może zmieścić się w zapytaniu. Miejsce zajmują instrukcje, historia rozmowy, notatki, dokumenty i nowa wiadomość. Aplikacja musi też uwzględnić miejsce na odpowiedź.',
    c6ExampleTitle: 'Wyjazd do Krakowa: trzy sposoby zapisu rozmowy',
    c6Example1Label: 'Pełny zapis rozmowy',
    c6Example1: '„Planuję wyjazd do Krakowa.”\n„Chyba w październiku.”\n„Coś dla wegetarian, proszę.”\n+ pełne odpowiedzi i dalsza rozmowa.',
    c6Example2Label: 'Streszczenie',
    c6Example2: 'Użytkownik planuje październikowy wyjazd do Krakowa. Pyta o wegetariańskie jedzenie, wycieczki, długość pobytu i pakowanie.',
    c6Example3Label: 'Notatki zewnętrzne',
    c6Example3: 'cel = Kraków\nmiesiąc = październik\ndieta = wegetariańska\n\nAplikacja pobiera potrzebne fakty i dołącza je do nowego promptu.',
    c6ExampleNote: 'To trzy sposoby zapisania tej samej przykładowej rozmowy. Nie przedstawiają rzeczywistego planu podróży ani pomiaru oszczędności tokenów.',
    c6H1: 'Pełna historia zajmuje coraz więcej miejsca',
    c6P1: 'Pełny zapis zachowuje sformułowania i szczegóły rozmowy, ale wydłuża się z każdą turą. Ponownie wysłane fragmenty znów zajmują miejsce w kontekście i mogą zwiększać koszt. Gdy zabraknie miejsca, aplikacja skraca historię, np. zachowuje instrukcje i najnowsze wiadomości.',
    c6H2: 'Streszczenie: mniej tekstu, mniej szczegółów',
    c6P2: 'Streszczenie skraca rozmowę do informacji uznanych za ważne. Zwykle wymaga mniej tokenów, ale może pominąć wyjątek, dokładny cytat lub zmianę zdania rozmówcy. Do jego przygotowania także może być potrzebne wywołanie modelu.',
    c6H3: 'Notatki są przechowywane poza modelem',
    c6P3: 'Plik, baza danych lub notatnik może przechowywać wybrane informacje także między sesjami. Sam zapis nie daje modelowi dostępu do tych informacji. Aplikacja musi je odnaleźć i dołączyć do kontekstu. Nietrafna lub nieaktualna notatka może prowadzić do błędnej odpowiedzi.',
    c6Takeaway: 'Gdy chatbot „zapomina”, sprawdź, co aplikacja zachowała i ponownie wysłała. To ona wybiera informacje do kontekstu. Model nie ma nieograniczonego miejsca na historię rozmowy.',
    c6Caveat: 'Streszczenie i notatki przygotowano ręcznie. Różne modele mają różne rozmiary okna kontekstowego, a aplikacje mogą łączyć opisane sposoby zapisu.',
    c7Nav: 'Halucynacje', c7Title: 'Płynna odpowiedź nie musi być prawdziwa',
    c7Intro: 'Błędna odpowiedź może brzmieć równie pewnie jak poprawna. Model tworzy wiarygodnie brzmiący tekst, co nie zastępuje sprawdzenia faktów. Oceniaj więc treść i dowody, a nie sam ton wypowiedzi.',
    c7ExampleTitle: 'Przekonująco brzmiący błąd',
    c7Example1Label: 'Przykładowa błędna odpowiedź',
    c7Example1: '„Mars ma trzy księżyce: Fobos, Deimos i Tytan.”\n\nTaka odpowiedź pasuje do wzorca listy księżyców, choć zawiera błąd.',
    c7Example2Label: 'Co wymaga poprawy',
    c7Example2: 'Mars ma dwa księżyce: Fobosa i Deimosa. Tytan jest księżycem Saturna.\n\nSprawdź zarówno liczbę księżyców, jak i to, do której planety należy każdy z nich.',
    c7ExampleNote: 'Ten przykład halucynacji przygotowano wcześniej. Zdanie „Sydney jest stolicą Australii” też może brzmieć znajomo, choć stolicą jest Canberra.',
    c7H1: 'Sprawdzaj każde twierdzenie osobno',
    c7P1: 'Zdanie „Wieżę Eiffla ukończono w 1889 roku, jest najwyższą budowlą na świecie i nigdy jej nie remontowano” zawiera trzy twierdzenia. Pierwsze jest prawdziwe, dwa pozostałe są błędne. Jedna poprawna informacja nie potwierdza pozostałych. Sprawdzaj daty, liczby, nazwy i cytaty oraz to, czy przywołane źródło potwierdza dany wniosek.',
    c7H2: 'Aktualne informacje wymagają dostępu do danych',
    c7P2: 'Żeby odpowiedzieć na pytanie „Jaka jest teraz pogoda przy moim domu?”, trzeba znać lokalizację i aktualną pogodę. Model bez odpowiedniego narzędzia nie powinien zgadywać temperatury. Powinien wskazać, jakich danych mu brakuje, poprosić o nie lub skorzystać z dostępnego narzędzia.',
    c7H3: 'Prywatne dane wymagają dostępu',
    c7P3: 'Pytanie „Jaki jest numer telefonu mojej siostry?” nie daje modelowi dostępu do Twoich kontaktów. Musiałby otrzymać tę informację w kontekście albo przez narzędzie z odpowiednimi uprawnieniami. Bez tego nie ma podstaw do podania numeru. Odmowa zgadywania nie jest usterką.',
    c7H4: 'Niedawne wydarzenie trzeba sprawdzić',
    c7P4: 'Pytanie „Kto wygrał wczorajszy mecz?” może dotyczyć wydarzenia, którego nie obejmują dane treningowe. Bez aktualnego źródła model nie ma podstaw do podania wyniku. Nieaktualna wiedza, brak dostępu do prywatnych danych i brak narzędzi to różne ograniczenia. Pewny ton odpowiedzi nie usuwa żadnego z nich.',
    c7Takeaway: 'Ufaj informacjom potwierdzonym w źródłach, nie samemu stylowi odpowiedzi. Wskazanie braku danych lub użycie odpowiedniego narzędzia może być lepsze niż przekonująco brzmiące zgadywanie.',
    c7Caveat: 'Odpowiedzi i omówienia przygotowano na potrzeby lekcji. Aplikacja nie uruchamia modelu, detektora halucynacji ani wyszukiwarki. Narzędzie może pomóc zdobyć dane, ale jego wynik również bywa błędny.',
    c8Nav: 'Prompty', c8Title: 'Ten sam model, inne instrukcje',
    c8Intro: 'Prompt to tekst, na podstawie którego model tworzy odpowiedź. Sprecyzowanie celu, odbiorcy, przykładów i ograniczeń może zmienić wynik bez zmiany wag modelu. Trzeba jednak sprawdzić, czy pomaga w danym zadaniu.',
    c8ExampleTitle: 'Ta sama prośba z dokładniejszym opisem oczekiwań',
    c8Example1Label: 'Wariant A', c8Example1: '„Wyjaśnij, czym jest token.”\n\nMożliwa odpowiedź: mały fragment tekstu, czasem słowo, czasem jego część.',
    c8Example2Label: 'Wariant B', c8Example2: '„Uczysz ciekawego świata 10-latka. Wyjaśnij mu, czym jest token, w 2 krótkich zdaniach, posługując się analogią z codziennego życia.”\n\nPrzykładowa analogia: token to klocek Lego, z którego model układa tekst.',
    c8ExampleNote: 'Odpowiedzi przygotowano wcześniej. Wariant B określa odbiorcę, długość odpowiedzi i prosi o analogię. Sam przykład nie dowodzi, że taka instrukcja zawsze pomoże.',
    c8H1: 'Rola, odbiorca i ton',
    c8P1: 'Zamiast „Streść ten artykuł”: „Jesteś redaktorem wiadomości. Streść artykuł w 3 punktach dla zapracowanego czytelnika”. Rola wpływa na styl odpowiedzi, ale nie nadaje modelowi kwalifikacji. Możesz określić odbiorcę, poprosić o analogię z codziennego życia, formalny ton lub humor, jeśli pasują do zadania.',
    c8H2: 'Few-shot: pokaż, czego oczekujesz',
    c8P2: '„Przykład 1: [artykuł] → [streszczenie w 3 punktach]. Przykład 2: [artykuł] → [streszczenie w 3 punktach]. Teraz zrób to samo”. Przykłady pokazują oczekiwany format, długość i sposób wyboru informacji. Model może je naśladować, ale wynik nadal trzeba sprawdzić.',
    c8H3: 'Kroki pośrednie zamiast ogólnej prośby',
    c8P3: '„Najpierw wypisz główne twierdzenia artykułu, potem na ich podstawie napisz streszczenie w 3 zdaniach”. Taka instrukcja dzieli zadanie na etapy, których wyniki można sprawdzić. Technikę tę często omawia się przy chain-of-thought. Wygenerowane wyjaśnienie nie dowodzi jednak, że dokładnie tak przebiegały wewnętrzne obliczenia modelu.',
    c8H4: 'Precyzyjne ograniczenia',
    c8P4: 'Instrukcja „Dokładnie 3 zdania, maksymalnie 60 słów łącznie, bez wypunktowań” jest bardziej precyzyjna niż „krótko”. Możesz określić długość, zakres, formę listy lub ton odpowiedzi. Model nie zawsze dotrzyma tych warunków, więc jeśli limit jest ważny, policz zdania i słowa.',
    c8H5: 'JSON: odpowiedź do dalszego przetwarzania',
    c8P5: '„Zwróć tylko JSON z polami headline i bullets, gdzie bullets zawiera 3 elementy”. Taki format ułatwia dalsze przetwarzanie odpowiedzi. Sam prompt nie gwarantuje jednak poprawnego JSON-u. Program powinien odczytać go parserem i sprawdzić zgodność ze schematem, zamiast wykonywać tekst odpowiedzi jako kod.',
    c8Takeaway: 'Dobry prompt precyzuje zadanie. Nie jest magiczną formułą, która „odblokowuje” model. Porównuj różne wersje na rzeczywistych zadaniach i sprawdzaj poprawność, format oraz przydatność odpowiedzi.',
    c8Caveat: 'Nie porównujemy tu wyników dwóch zapytań do AI. W źródłowej symulacji odpowiedzi powstawały według prostych reguł. Skuteczność opisanych technik zależy od modelu i zadania.',
    c9Nav: 'RAG', c9Title: 'RAG: fragmenty dokumentów w kontekście',
    c9Intro: 'Model nie dostaje automatycznie Twoich plików. W systemie RAG (generowanie wspomagane wyszukiwaniem) wyszukiwarka wybiera przydatne fragmenty dokumentów, a aplikacja dołącza je do promptu. Model może wtedy oprzeć odpowiedź na tych źródłach.',
    c9ExampleTitle: 'Od pytania do właściwego fragmentu',
    c9Example1Label: 'Pytanie i wyszukany fragment',
    c9Example1: 'Pytanie: Jaki produkt uboczny powstaje podczas fotosyntezy?\n\nFragment C4: „Fotosynteza uwalnia tlen jako produkt uboczny, który jest niezbędny dla większości życia na Ziemi”.',
    c9Example2Label: 'Odpowiedź oparta na tekście',
    c9Example2: '„Tlen” [C4].\n\nInne fragmenty tego dokumentu opisują przemianę światła w energię (C1), chloroplasty i chlorofil (C2) oraz reakcje zależne od światła i cykl Calvina (C3).',
    c9ExampleNote: 'Przykład przygotowano ręcznie. Oznaczenie [C4] odsyła do źródła, ale samo w sobie nie potwierdza poprawności całej odpowiedzi.',
    c9H1: 'Najpierw wyszukiwanie, potem generowanie',
    c9P1: 'Dokument zostaje podzielony na fragmenty. Wyszukiwarka wybiera te, które pasują do pytania, a aplikacja dołącza je do kontekstu. Pytanie „Co zielone liście wypuszczają do powietrza?” może nie znaleźć właściwego fragmentu przy prostym dopasowaniu słów, choć dotyczy tego samego procesu. Wyszukiwanie semantyczne korzysta z osadzeń. Można je łączyć z wyszukiwaniem po słowach kluczowych.',
    c9H2: 'Zbyt małe lub zbyt duże fragmenty',
    c9P2: 'Jeśli potrzebne wyjaśnienie znajduje się w dwóch sąsiadujących fragmentach, pobranie tylko jednego może pozbawić model części kontekstu. Większe lub częściowo nakładające się fragmenty pomagają go zachować. Wymagają jednak więcej tokenów i mogą zawierać powtórzenia oraz zbędne informacje. Nie ma jednego rozmiaru odpowiedniego dla wszystkich dokumentów.',
    c9H3: 'Niejednoznaczne pytanie',
    c9P3: 'Pytanie „Jak to się zaczyna?” nie wyjaśnia, czego dotyczy. Wyszukiwarka może wybrać akapit o chlorofilu zamiast o reakcjach zależnych od światła. Zanim uznasz, że zawiódł model, doprecyzuj pytanie i sprawdź, jakie fragmenty rzeczywiście znalazły się w prompcie.',
    c9H4: 'Sprzeczne źródła',
    c9P4: 'Jeśli jeden dokument mówi o dwóch etapach, a drugi o trzech, dołączenie obu do kontekstu nie rozstrzyga sprzeczności. Trzeba sprawdzić, czego dotyczą i na ile są wiarygodne. W przeciwnym razie model może połączyć je w błędną odpowiedź. Warto też sprawdzić, czy odsyłacz rzeczywiście prowadzi do źródła danej informacji.',
    c9Takeaway: 'RAG zmienia zawartość promptu, nie wiedzę zapisaną w wagach. Jeśli model nie otrzyma właściwego fragmentu dokumentu, jego jakość nie zastąpi brakującego źródła.',
    c9Caveat: 'Aplikacja nie korzysta z bazy wektorowej ani nie przeszukuje dokumentów. Przykłady pochodzą z krótkiego tekstu edukacyjnego. RAG może ograniczać część problemów, ale nie eliminuje halucynacji ani sprzeczności między źródłami.',
    c10Nav: 'Trening', c10Title: 'Jak powstaje pomocny asystent?',
    c10Intro: 'Umiejętność przewidywania tekstu nie oznacza jeszcze, że model będzie zachowywał się jak asystent. Najpierw uczy się na danych, a później może być dostrajany do instrukcji i preferencji. Na jego zachowanie wpływają cel i skala treningu.',
    c10ExampleTitle: '„Jak ugotować jajko na twardo?”',
    c10Example1Label: 'Poglądowa kontynuacja modelu bazowego',
    c10Example1: '„Ile to trwa? Jaka powinna być temperatura wody? Jak usmażyć jajko? Jak zrobić jajko w koszulce?”\n\nLista kolejnych pytań też może pasować jako dalszy tekst.',
    c10Example2Label: 'Poglądowa odpowiedź modelu dostrojonego',
    c10Example2: '„Włóż jajka do garnka i zalej wodą. Zagotuj, dostosuj czas do pożądanego stopnia ścięcia, potem schłodź”.\n\nTa odpowiedź pomaga wykonać zadanie, zamiast dopisywać kolejne pytania.',
    c10ExampleNote: 'Oba teksty są napisane ręcznie. To porównanie zachowań, nie test dwóch modeli ani sprawdzony przepis.',
    c10H1: 'Trening wstępny (pretraining)',
    c10P1: 'Podczas treningu wstępnego model uczy się przewidywać tekst na podstawie ogromnych zbiorów przykładów. Zmieniają się wtedy jego parametry, czyli liczby określające przebieg obliczeń. W ten sposób model nabywa umiejętności językowe i uczy się wzorców przydatnych w różnych zadaniach. Nie powstaje przy tym baza gotowych odpowiedzi.',
    c10H2: 'Skala treningu: dane, parametry i obliczenia',
    c10P2: 'Przy porównywaniu skali treningu rozróżniaj ilość danych, liczbę parametrów i nakład obliczeń. Różnice mogą sięgać rzędów wielkości, dlatego do pokazania proporcji przydaje się skala logarytmiczna. Większa wartość jednego wskaźnika nie wystarczy do oceny jakości modelu. Nie podajemy tu statystyk konkretnych generacji modeli.',
    c10H3: 'Dostrajanie do instrukcji i oczekiwań (alignment)',
    c10P3: 'Dalszy trening ma nauczyć model odpowiadania na pytania, stosowania się do instrukcji, przyznawania się do ograniczeń i odmawiania szkodliwych próśb. Model bazowy potrafi kontynuować tekst, a dostrojony ma częściej zachowywać się jak pomocny asystent. Nie gwarantuje to jednak poprawności ani bezpieczeństwa w każdej sytuacji.',
    c10H4: 'RLHF: nauka z ludzkich preferencji',
    c10P4: 'Ludzie porównują odpowiedzi, np. na prośbę o pomysł na prezent: „Co lubi ta osoba?” lub „Kup ekspres, wszyscy go lubią”. W klasycznym RLHF takie oceny służą do uczenia modelu nagrody, który przewiduje ludzkie preferencje. Następnie model językowy jest dostrajany tak, by częściej tworzył wyżej oceniane odpowiedzi. Uczy się na ocenach, zamiast otrzymywać każdą regułę zapisaną ręcznie.',
    c10Takeaway: 'Trening zmienia wagi modelu, a prompt zmienia tekst wejściowy. Dostrajanie i RLHF wpływają na to, jak model wykorzystuje wyuczone umiejętności. Jego odpowiedzi nadal trzeba oceniać krytycznie.',
    c10Caveat: 'Porównanie modelu bazowego i dostrojonego jest uproszczone. Liczby w źródłowej symulacji miały charakter poglądowy, a samo zliczanie preferowanych odpowiedzi nie jest treningiem modelu nagrody. RLHF to jeden ze sposobów dostrajania, nie opis działania każdego modelu.',
    c11Nav: 'Podsumowanie', c11Title: 'Co dzieje się z jedną wiadomością?',
    c11Intro: 'Za odpowiedzią chatbota nie stoi ukryty człowiek ani gotowy tekst wyjęty z bazy. Aplikacja przygotowuje kontekst, a wytrenowany model generuje odpowiedź token po tokenie. Tak łączą się etapy opisane w poprzednich rozdziałach.',
    c11ExampleTitle: 'Ta sama wiadomość, dwie warstwy',
    c11Example1Label: 'Na ekranie', c11Example1: 'Piszesz pytanie.\nWidzisz płynną odpowiedź.\nRozmowa sprawia wrażenie, że trwa bez przerwy.',
    c11Example2Label: 'W aplikacji i modelu', c11Example2: 'Aplikacja przygotowuje kontekst.\nModel przetwarza tokeny i ich reprezentacje.\nZ kolejnych wybranych tokenów powstaje odpowiedź, którą wyświetla aplikacja.',
    c11ExampleNote: 'Każdy element odpowiada za inne zadanie. Jeśli odpowiedź jest błędna, sprawdź, na którym etapie zabrakło informacji lub kontroli.',
    c11H1: 'Aplikacja przygotowuje prompt', c11P1: 'Instrukcje, zachowana historia lub notatki, Twoja wiadomość i ewentualne fragmenty z RAG trafiają do szablonu czatu. Aplikacja dba o to, by nie przekroczyć limitu kontekstu.',
    c11H2: 'Tokenizator dzieli tekst', c11P2: 'Tekst zamienia się w sekwencję numerów tokenów ze słownika. Liczba tokenów wpływa na koszt i ilość informacji mieszczących się w kontekście. Nie musi odpowiadać liczbie słów.',
    c11H3: 'Model odczytuje wektory przypisane do ID', c11P3: 'Osadzenia zapisują tokeny jako wektory, dzięki czemu można obliczać relacje między nimi. Informacja o pozycji pozwala uwzględnić także ich kolejność.',
    c11H4: 'Transformer przetwarza dostępny kontekst', c11P4: 'Wiele warstw i głów uwagi łączy informacje. W dekoderze przyczynowym reprezentacja tokenu uwzględnia jego bieżącą pozycję i wcześniejsze tokeny, ale nie późniejsze.',
    c11H5: 'Model oblicza prawdopodobieństwa, potem wybierany jest token', c11P5: 'Model ocenia możliwe kontynuacje tekstu. Na wybór kolejnego fragmentu wpływa sposób wyboru tokenu: próbkowanie z daną temperaturą lub wybór zachłanny.',
    c11H6: 'Kolejne kroki tworzą odpowiedź', c11P6: 'Wybrany token trafia do kontekstu i rozpoczyna się następny krok. Proces trwa do zakończenia generowania. Aplikacja może wyświetlać napływający tekst na bieżąco w dymku czatu.',
    c11H7: 'Płynna odpowiedź wymaga sprawdzenia', c11P7: 'Sprawdzaj twierdzenia, aktualność danych i źródła. Narzędzia oraz RAG mogą dostarczyć potrzebnych informacji. Jeśli ich brakuje, lepiej to przyznać niż zgadywać.',
    c11H8: 'Trening i prompty kształtują zachowanie', c11P8: 'Trening wstępny, dostrajanie i oceny preferencji zmieniają model. Twoje instrukcje i kontekst wpływają na jego odpowiedzi bez trenowania go od nowa.',
    c11Takeaway: 'Aplikacja dostarcza kontekst wytrenowanemu modelowi. Ten przekształca tokeny w reprezentacje i oblicza prawdopodobieństwa, a odpowiedź powstaje token po tokenie. Nawet jeśli brzmi płynnie, trzeba ją sprawdzić.',
    c11Caveat: 'To uproszczony opis chatbota tekstowego z modelem autoregresyjnym. Wszystkie przykłady przygotowano wcześniej i są dostępne lokalnie. Żadne ćwiczenie nie uruchamia ani nie trenuje modelu AI.'
  },
