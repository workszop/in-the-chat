    c1Nav: 'App vs model', c1Title: 'The chat app is not the model',
    c1Intro: 'Message bubbles, history and “memory” belong to the app. The model underneath receives a prepared context and scores which text fragment might come next.',
    c1ExampleTitle: 'Why does the chatbot “remember” Ola?',
    c1Example1Label: 'What you see in the chat',
    c1Example1: 'You: Hi! My name is Ola.\nAssistant: Nice to meet you, Ola!\nYou: What is my name?',
    c1Example2Label: 'What the app sends again',
    c1Example2: 'System instruction: Be helpful and concise.\nHistory: “My name is Ola” + the assistant’s reply.\nNew message: “What is my name?”',
    c1ExampleNote: 'If the app drops the history and sends only the last question, the name is no longer in the context. This example is written in advance, not generated by AI.',
    c1H1: 'The app prepares the request',
    c1P1: 'It stores the conversation, adds a system prompt and formats roles using a chat template. It may include notes, documents and tool results. It then sends this sequence to the model and displays the incoming reply.',
    c1H2: 'The model processes what it receives',
    c1P2: 'In the inference setup described here, the model does not add your conversation to its weights on every question. Weights are trained numbers; the input is the context, and the result of one step is a probability distribution for the next token. Product memory is not the same as remembering between separate model calls.',
    c1H3: 'Same model, different product',
    c1P3: 'Different system instructions, history, tools or filters can change the app’s behaviour without changing the weights. Helpfulness and safety also depend on the model’s training and alignment, which we return to in chapter 10.',
    c1Takeaway: 'A chatbot knows your name on the next turn if the app supplies that information again. Apparent conversational memory does not prove that the model has just learned about you.',
    c1Caveat: 'Real chat templates use model-specific special tokens, and system prompts can be much longer. An app may send only selected history or a summary.',
    c2Nav: 'Tokenization', c2Title: 'Tokenization: text becomes numbers',
    c2Intro: 'The model works with tokens: small pieces of text. A tokenizer may keep a common word whole, split another into parts or encode a character with several pieces. Each piece has an ID in a vocabulary.',
    c2ExampleTitle: 'Three “r” letters, but not three separate tokens',
    c2Example1Label: 'The same meaning, different languages',
    c2Example1: 'EN: I love programming in Kraków\nPL: Uwielbiam programować w Krakowie\nDE: Ich liebe es, in Krakau zu programmieren',
    c2Example2Label: 'What to compare',
    c2Example2: 'Count tokens for the chosen model, not just words. Different languages and tokenizers can produce different counts for the same meaning.',
    c2ExampleNote: 'The split “str | aw | berr | y” is illustrative. Underlines show the three r letters in strawberry. This is not the output of a real tokenizer.',
    c2TokenNote: 'strawberry: 10 letters, 3 × r, here 4 illustrative pieces',
    c2H1: 'An ID is not a meaning',
    c2P1: 'A token number is a vocabulary label, not its letter count, position in a sentence or probability. Neighbouring numbers need not represent related things. A space can be part of a token too; the symbol ␣ is sometimes used to make it visible.',
    c2H2: 'Why language affects cost',
    c2P2: 'The vocabulary is learned from data. If a language or rare word has fewer useful matches in it, the text can split into more pieces. Polish may need more tokens than English expressing the same meaning, but the exact difference depends on the text and tokenizer. More tokens can mean higher cost, more processing and less room in the context.',
    c2H3: 'Why counting letters can be difficult',
    c2P3: 'The model receives fragment IDs, not a simple list of letters to count. The r letters in strawberry are spread inside several pieces. This is a difficulty, not proof that a model can never count correctly. When an exact count matters, check character by character or use a tool.',
    c2Takeaway: 'A token does not have to be a word or a letter. Context and often model usage are measured in tokens, so check the specific model’s tokenization instead of guessing from sentence length.',
    c2Caveat: 'This hand-made split does not reproduce BPE or another production tokenizer. Real vocabularies can split rare text and emoji into smaller pieces or bytes; we are not calculating API costs.',
    c3Nav: 'Embeddings', c3Title: 'Embeddings: numbers represent relationships',
    c3Intro: 'An ID is only a label. A learned table converts it into an embedding, a vector of numbers. This lets the model compare, mix and transform representations of text.',
    c3ExampleTitle: 'Closeness, not alphabetical order',
    c3Example1Label: 'Similar contexts',
    c3Example1: 'cat ↔ kitten\nking ↔ queen\npizza ↔ pasta\n\nWords used in similar situations may have similar vectors.',
    c3Example2Label: 'An illustrative analogy',
    c3Example2: 'king − man + woman ≈ queen\n\nA direction in the space may correspond to a relationship between concepts.',
    c3ExampleNote: 'These examples help you imagine the space, but are not measurements from a particular model. “pizza − bread + laptop” need not produce a meaningful analogy.',
    c3H1: 'Meaning as geometry',
    c3P1: 'Representations are learned from contexts of use during training. Nearby vectors may reflect related meaning rather than similar spelling. One comparison method is cosine similarity, which describes how closely directions match. It is not a probability that two words “mean the same thing”.',
    c3H2: 'A 2D map is only a shadow',
    c3P2: 'Real vectors have many dimensions, often thousands in language models. A two-dimensional picture cannot preserve every relationship. Axes on an illustrative map are not universal axes of “meaning”, and neighbourhoods depend on the particular model.',
    c3H3: 'Context changes the representation',
    c3P3: 'An input embedding is not the end of the process. Successive transformer layers enrich a token’s representation with available context. “Bank” beside “river” and “bank” beside “loan” have the same spelling but different surroundings and interpretations.',
    c3Takeaway: 'An embedding makes relationships between pieces of text computable. It is a useful representation, not a dictionary of definitions or a guarantee that every analogy will work.',
    c3Caveat: 'The word pairs and arithmetic illustrate an idea. We do not show actual coordinates, similarity scores or model layers; this is not an experiment on live embeddings.',
    c4Nav: 'Attention', c4Title: 'Attention: meaning depends on context',
    c4Intro: 'Attention lets a token’s representation use other available tokens. In a model that generates from left to right, there is an important limit: a token cannot look into the future.',
    c4ExampleTitle: 'One ending changes the interpretation',
    c4Example1Label: '… because it was too big',
    c4Example1: 'The trophy did not fit in the suitcase because it was too big.\n\nAfter reading the whole sentence, we understand: the trophy was too big.',
    c4Example2Label: '… because it was too small',
    c4Example2: 'The trophy did not fit in the suitcase because it was too small.\n\nAfter reading the whole sentence, we understand: the suitcase was too small.',
    c4ExampleNote: 'We are comparing the meaning of complete sentences. We are not claiming that the earlier token “it” saw the future word “big” or “small”.',
    c4H1: 'Weighting the available context',
    c4P1: 'An attention layer computes which available representations to draw information from and how to combine them. Different heads can capture different relationships, and later layers process the result further. This is more than pointing to one “most important” word.',
    c4H2: 'Causal attention only looks backwards',
    c4P2: 'In a causal decoder, a position can use itself and earlier positions, not later ones. Changing a sentence’s ending cannot retroactively change the earlier representation of “it”. When processing the ending and predicting a continuation, however, the model has more context available.',
    c4H3: 'Many layers, not a single arrow',
    c4P3: 'The model combines many attention heads and transformer layers. Relationships are learned during training, not entered as manual pronoun rules. A single attention-weight map is not a complete explanation of why a model gave a particular answer.',
    c4Takeaway: 'Context helps resolve ambiguity, but only when it is already available. A model generating left to right cannot read tokens that have not been produced yet.',
    c4Caveat: 'The sentences are hand-picked illustrations. We do not compute attention weights. The original simulation used hand-written weights, not measurements from a real transformer.',
    c5Nav: 'Generation', c5Title: 'Generation: one token at a time',
    c5Intro: 'After processing the context, the model scores possible next tokens. One token is selected from the distribution and appended to the text, then prediction starts again. This is how a reply grows.',
    c5ExampleTitle: '“The cat sat on the…”',
    c5Example1Label: 'One choice', c5Example1: 'The cat sat on the → mat\n\nWe choose one possible piece, not an entire sentence.',
    c5Example2Label: 'A new context', c5Example2: 'The cat sat on the mat → …\n\nThe selected token changes the next step’s input. The loop continues until the reply ends.',
    c5ExampleNote: 'These values are a hand-written example table: mat 40%, sofa 18%, floor 15%, windowsill 12%, roof 9%, keyboard 6%. They are not measured probabilities from a real model.',
    c5Candidate1: 'mat', c5Candidate2: 'sofa', c5Candidate3: 'floor', c5Candidate4: 'windowsill', c5Candidate5: 'roof', c5Candidate6: 'keyboard',
    c5H1: 'A distribution is not a verified fact',
    c5P1: 'One step gives a distribution over the vocabulary, not a complete paragraph or a certificate of truth. A model may assign high probability to the correct continuation “Warsaw is the capital of Poland”, but a high-scoring token is still not a source check.',
    c5H2: 'What temperature changes',
    c5P2: 'Lower temperature sharpens the distribution, favouring already likely options more strongly. Higher temperature flattens it, giving less typical options more opportunity and increasing variety, but also the risk of incoherence. Temperature is not a truth or intelligence slider.',
    c5H3: 'Sampling versus greedy selection',
    c5P3: 'Sampling draws according to the distribution. Greedy selection takes the highest-scoring token, so it makes the same choice for the same distribution. Systems may also use top-p or top-k and stop at an end token or a length limit.',
    c5Takeaway: 'A reply grows one token at a time. A plausible continuation can be wrong, and later steps can develop that error fluently.',
    c5Caveat: 'We show just six hand-written candidates. A real model works over its whole vocabulary. This loop diagram does not describe every optimisation or reasoning method in modern systems.',
    c6Nav: 'Memory', c6Title: 'The context window: what fits in the conversation?',
    c6Intro: 'The context window limits the tokens available in a request. Instructions, history, notes, documents and the new message compete for space. The app must also account for the reply budget.',
    c6ExampleTitle: 'A trip to Kraków, recorded three ways',
    c6Example1Label: 'Raw history',
    c6Example1: '“I’m planning a trip to Kraków.”\n“Probably in October.”\n“Vegetarian-friendly, please.”\n+ full replies and the rest of the conversation.',
    c6Example2Label: 'A summary',
    c6Example2: 'The user is planning an October trip to Kraków. They ask about vegetarian food, day trips, trip length and packing.',
    c6Example3Label: 'External notes',
    c6Example3: 'destination = Kraków\nmonth = October\ndiet = vegetarian\n\nThe app retrieves relevant facts and adds them to a new prompt.',
    c6ExampleNote: 'These are three representations of the same example conversation, not actual travel advice or a measured token saving.',
    c6H1: 'History: fidelity at the cost of space',
    c6P1: 'Raw history preserves wording and detail but grows every turn. Every fragment sent again takes up context and may add cost again. When space runs out, the app trims history, for example keeping the latest turns and instructions.',
    c6H2: 'Summary: less text, fewer details',
    c6P2: 'A summary compresses the conversation into what was judged important. It usually takes fewer tokens but may lose an exception, an exact quote or a change of mind. Producing the summary may itself require a model call.',
    c6H3: 'Notes: a store outside the model',
    c6P3: 'A file, database or notebook keeps selected facts, including across sessions. Merely saving a fact does not make the model see it: the app must retrieve it and place it in the context. An irrelevant or outdated note can mislead the reply.',
    c6Takeaway: 'When a chatbot “forgets”, check what the app actually retained and sent again. Memory is a selection of information, not an infinite storage drawer inside the model.',
    c6Caveat: 'The summary and notes are written in advance. We do not assume one context-window size for every model; real systems may combine these strategies.',
    c7Nav: 'Hallucinations', c7Title: 'Fluency is not the same as truth',
    c7Intro: 'A wrong answer can sound as confident as a correct one. Generating a plausible continuation does not replace checking a fact. A good user separates the tone of a reply from its evidence.',
    c7ExampleTitle: 'It sounds convincing. It is still wrong.',
    c7Example1Label: 'An example of a false reply',
    c7Example1: '“Mars has three moons: Phobos, Deimos and Titan.”\n\nIt fits the pattern of a list of moons. That does not make it true.',
    c7Example2Label: 'What needs correcting',
    c7Example2: 'Mars has two moons: Phobos and Deimos. Titan is a moon of Saturn.\n\nCheck both the count and the assignment of every name.',
    c7ExampleNote: 'This is a pre-written hallucination example. Similarly, “Sydney is the capital of Australia” sounds familiar, but the capital is Canberra.',
    c7H1: 'Break a reply into checkable claims',
    c7P1: '“The Eiffel Tower was completed in 1889, is the world’s tallest structure and has never needed renovation” contains three separate claims. The first is correct; the next two are not. One true part does not validate the rest. Check dates, numbers, names, quotations and whether a source actually supports the conclusion.',
    c7H2: 'Live information needs access',
    c7P2: '“What is the weather at my house right now?” needs a location and current data. A model without the right tool should not invent a temperature. The appropriate response is to state the limitation, ask for needed information or use an available tool.',
    c7H3: 'A private fact cannot come from a guess',
    c7P3: '“What is my sister’s phone number?” does not give the model access to your contacts. Without information in the context or an authorised tool, there is no basis for a number. Refusing to guess is honest behaviour, not a malfunction.',
    c7H4: 'Recent events need checking',
    c7P4: '“Who won yesterday’s match?” may concern an event after the training data period. Without a current source, the model has no basis to claim it knows the score. Freshness, privacy and tool access are different limitations; none disappear because a reply sounds confident.',
    c7Takeaway: 'Build trust on checked sources, not fluency. “I do not have the data” or use of the right tool can be better than an impressive guess.',
    c7Caveat: 'All replies and explanations are an educational scenario. We are not running a model, hallucination detector or search engine. A connected tool can help obtain evidence, but it can also fail.',
    c8Nav: 'Prompting', c8Title: 'Same model, different instructions',
    c8Intro: 'A prompt is the content from which the model generates a reply. A clear goal, audience, examples and constraints can change the result without changing model weights. Test the effect on the actual task.',
    c8ExampleTitle: 'The same request, a clearer result',
    c8Example1Label: 'Variant A', c8Example1: '“Explain what a token is.”\n\nA possible answer: a small piece of text, sometimes a word and sometimes part of one.',
    c8Example2Label: 'Variant B', c8Example2: '“You are teaching a curious 10-year-old. In 2 short sentences and one everyday analogy, explain what a token is.”\n\nA possible analogy: a token is like a Lego brick for words.',
    c8ExampleNote: 'The replies are written in advance. Variant B specifies an audience, length and analogy; it does not prove that every such instruction will help.',
    c8H1: 'Role, audience and tone',
    c8P1: 'Instead of “Summarise this article”: “You are a news editor. Summarise the article in 3 bullets for a busy reader”. A role guides style, not professional qualifications. You can specify an audience, an everyday analogy, a formal tone or humour if these serve the task.',
    c8H2: 'Few-shot: show what you want',
    c8P2: '“Example 1: [article] → [3-bullet summary]. Example 2: [article] → [3-bullet summary]. Now do the same.” A few examples demonstrate format, length and what to prioritise. The model may imitate them, but the result still needs checking.',
    c8H3: 'Intermediate steps instead of a vague request',
    c8P3: '“First list the article’s main claims, then use them to write a 3-sentence summary.” This technique, often discussed alongside chain-of-thought, separates the task into checkable stages. The resulting explanation is not evidence of the exact internal computations the model performed.',
    c8H4: 'Explicit constraints',
    c8P4: '“Exactly 3 sentences, at most 60 words in total, no bullets” is less ambiguous than “briefly”. Constraints can specify length, scope, a list or tone. An instruction does not guarantee compliance: count the sentences and words when the limit matters.',
    c8H5: 'JSON and a format for software',
    c8P5: '“Return only JSON with headline and bullets fields, with 3 items in bullets.” Structure makes further processing easier, but a prompt alone does not guarantee valid JSON. Software should parse it and validate a schema, not execute the reply text as code.',
    c8Takeaway: 'A good prompt specifies a task rather than “unlocking” a model with a magic formula. Compare variants on real tasks, checking correctness, format and usefulness.',
    c8Caveat: 'We are not comparing two AI calls. In the source simulation, simple rules assembled replies; the effectiveness of techniques depends on the model and task.',
    c9Nav: 'RAG', c9Title: 'RAG: a document enters the context',
    c9Intro: 'A model does not automatically receive your files. Retrieval-augmented generation (RAG) finds useful document fragments and adds them to the prompt. The reply can then draw on the supplied source.',
    c9ExampleTitle: 'From a question to the relevant fragment',
    c9Example1Label: 'The question and retrieved fragment',
    c9Example1: 'Question: What byproduct does photosynthesis release?\n\nFragment C4: “Photosynthesis releases oxygen as a byproduct, which is essential for most life on Earth.”',
    c9Example2Label: 'An answer grounded in the text',
    c9Example2: '“Oxygen” [C4].\n\nOther fragments describe converting light to energy (C1), chloroplasts and chlorophyll (C2), and light-dependent reactions and the Calvin cycle (C3).',
    c9ExampleNote: 'This example is prepared by hand. The [C4] marker shows a connection to a source, not automatic confirmation of every part of a reply.',
    c9H1: 'Retrieve first, generate second',
    c9P1: 'Documents are split into chunks, retrieval selects ones relevant to the question, and the app adds them to the context. “What do green leaves put into the air?” may fail a simple word match even though it asks about the same process. Semantic retrieval uses embeddings; systems may combine this with keyword retrieval.',
    c9H2: 'Chunks that are too small or too large',
    c9P2: 'If the needed explanation crosses a chunk boundary, retrieving just one side loses context. A larger chunk or some overlap between chunks may preserve it, but adds tokens, repetition and noise. There is no single right chunk size for every document.',
    c9H3: 'An ambiguous question',
    c9P3: '“How does it start?” does not identify “it”. Retrieval may select a paragraph about chlorophyll instead of light-dependent reactions. Clarify the question and inspect the chunks actually sent to the prompt before blaming the generator.',
    c9H4: 'Contradictory sources',
    c9P4: 'If one document describes two stages and another three, placing both in the context does not resolve the conflict. Their scope and reliability need to be established; the model might otherwise blend them into a false answer. A source reference also needs checking.',
    c9Takeaway: 'RAG changes the prompt, not the knowledge stored in the weights. If the right fragment never reaches the model, model quality alone cannot replace missing evidence.',
    c9Caveat: 'No vector database or real retrieval is running here. The examples come from a small educational document. RAG reduces some problems, but does not eliminate hallucinations or source conflicts.',
    c10Nav: 'Training', c10Title: 'How is a helpful assistant made?',
    c10Intro: 'Predicting text and behaving as an assistant are not the same thing. A model first learns from data, then may be tuned for instructions and preferences. Training scale and objectives affect the resulting behaviour.',
    c10ExampleTitle: '“How do I boil an egg?”',
    c10Example1Label: 'An illustrative base-model continuation',
    c10Example1: '“How long does it take? What temperature should the water be? How do I fry an egg? How do I poach an egg?”\n\nA list of further questions can also be a plausible continuation.',
    c10Example2Label: 'An illustrative instruction-tuned reply',
    c10Example2: '“Put the eggs in a pot and cover with water. Bring to a boil, adjust the time to the desired doneness, then cool.”\n\nThe reply takes on the user’s task instead of just continuing the question format.',
    c10ExampleNote: 'Both texts are hand-written. This compares behaviours, not two live models, and is not a verified recipe.',
    c10H1: 'Pretraining: learning prediction',
    c10P1: 'During pretraining, a model learns to predict text from very large sets of examples. Its parameters, the numbers governing its computations, are updated. This develops language capabilities and patterns useful across tasks, not a database of ready-made replies.',
    c10H2: 'Scale means data, parameters and compute',
    c10P2: 'Separate the amount of training data, parameter count and computational work when comparing scale. These quantities can differ by orders of magnitude; a logarithmic scale helps show their proportions. A larger number alone is not a complete description of model quality. We do not present statistics for specific generations here.',
    c10H3: 'Instruction tuning and alignment',
    c10P3: 'Further training aims to encourage answering questions, following instructions, acknowledging limitations and refusing harmful requests. A base model can continue text; an instruction-tuned model should more often behave as an assistant. Tuning does not guarantee correctness or safety in every situation.',
    c10H4: 'RLHF: learning from human preferences',
    c10P4: 'People compare replies, for example to a gift request: “What does the person enjoy?” versus “Buy an espresso machine, everyone likes them”. In a classic RLHF setup, rankings train a reward model to predict preferences, then the language model is tuned towards higher-rated replies. This is learning from judgements, not entering every rule by hand.',
    c10Takeaway: 'Training changes weights. A prompt changes input. Tuning and RLHF shape how learned capabilities are used, but the result still needs critical evaluation.',
    c10Caveat: 'The base/instruction comparison is illustrative. The original scale numbers were not published model statistics, and counting preferred replies is not real reward-model training. RLHF is one tuning approach, not a description of every model.',
    c11Nav: 'Recap', c11Title: 'The whole journey of one message',
    c11Intro: 'Let’s put the pieces together. There is no person hidden in the chat and no drawer containing a ready-made reply. There is an app, a trained model, prepared context and a generation loop.',
    c11ExampleTitle: 'The same message, two layers',
    c11Example1Label: 'On the screen', c11Example1: 'You write a question.\nYou see a fluent reply.\nThe conversation feels continuous.',
    c11Example2Label: 'Underneath', c11Example2: 'The app assembles context.\nThe model processes tokens and their representations.\nSelected tokens build a reply that the app displays.',
    c11ExampleNote: 'Each part has a different job. When a reply fails, ask which layer lacked information or a check.',
    c11H1: 'The app assembles the prompt', c11P1: 'Instructions, retained history or notes, your message and optional RAG fragments go into a chat template. The app manages the context budget.',
    c11H2: 'The tokenizer splits the text', c11P2: 'Text becomes a sequence of vocabulary token IDs. The fragment count affects cost and how much information fits; it need not match the word count.',
    c11H3: 'IDs become vectors', c11P3: 'Embeddings give labels representations on which relationships can be computed. Position information makes order matter too.',
    c11H4: 'The transformer processes available context', c11P4: 'Many layers and attention heads combine information. In a causal decoder, a token can use its own position and earlier ones, but not future positions.',
    c11H5: 'A distribution is produced and a token selected', c11P5: 'The model scores possible continuations. Sampling, temperature or greedy selection affect which piece is chosen.',
    c11H6: 'The loop builds the reply', c11P6: 'The selected token is appended to the context. Generation continues until stopping, while the app may stream the growing text into the chat bubble.',
    c11H7: 'Fluency does not verify truth', c11P7: 'Check claims, freshness and sources. Tools and RAG may supply information, and honestly acknowledging missing data is better than guessing.',
    c11H8: 'Training and prompting shape behaviour', c11P8: 'Pretraining, tuning and preference judgements change the model. Your instructions and context change the conditions under which it answers, without training it anew.',
    c11Takeaway: 'A chatbot is an app that supplies context to a trained model. The model turns tokens into representations and probabilities, and the reply grows one token at a time. Its fluency never replaces verification.',
    c11Caveat: 'This is a simplified account of a text chatbot with an autoregressive model. All examples are local and written in advance; nothing in this lesson calls or trains AI.'
  }
};

// ─── State ───
function initialState() { return {version: 1, lang: 'pl', chapter: 1, screen: 'lesson', completed: [], answers: {}, score: 0, storageStatus: 'ok', indexOpen: false}; }
const state = initialState();

// ─── DOM refs ───
const refs = {

// ─── Helpers ───
function t(key, values = {}) {

function node(tag, className, text) {

}
function chapterQuestions(chapter = state.chapter) { return QUESTIONS.filter(question => question.chapter === chapter); }

}
function isRecord(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }

    let repaired = false;
    if (['pl', 'en'].includes(saved.lang)) state.lang = saved.lang; else repaired = true;
    if (validChapter(saved.chapter)) state.chapter = saved.chapter; else repaired = true;
    if (Array.isArray(saved.completed)) {
      state.completed = [...new Set(saved.completed.filter(validChapter))].sort((a, b) => a - b);
      if (state.completed.length !== saved.completed.length) repaired = true;
    } else repaired = true;
    if (isRecord(saved.answers)) {
      for (const [id, answer] of Object.entries(saved.answers)) {
        const question = QUESTIONS.find(item => item.id === id);
        if (question && Number.isInteger(answer) && answer >= 0 && answer < question.options) state.answers[id] = answer;
        else repaired = true;
      }

    if (repaired) state.storageStatus = 'recovered';

}
function persist() {

}

function applyAnswerState(wrapper, question) {

  wrapper.querySelectorAll('[data-answer]').forEach(option => {

      const answered = Object.hasOwn(state.answers, question.id);
      const options = [...wrapper.querySelectorAll('[data-answer]')];
      return options.length === question.options && (answered ? Number(wrapper.dataset.selected) === state.answers[question.id] && wrapper.dataset.correct === String(state.answers[question.id] === question.correct) : !Object.hasOwn(wrapper.dataset, 'selected')) && options.every((option, index) => Number(option.dataset.answer) === index && option.disabled === answered && (answered ? option.dataset.selected === String(index === state.answers[question.id]) && option.dataset.correct === String(index === question.correct) : !Object.hasOwn(option.dataset, 'selected'))) && wrapper.querySelector('.question-feedback').hidden === !answered;
    })],
    ['verifyProgress', () => {
      const totalStats = stats();
      return refs.readingProgress.isConnected && refs.readingProgress.max === TOTAL && refs.readingProgress.value === state.completed.length && totalStats.correct <= totalStats.answered && totalStats.answered <= QUESTIONS.length && (state.screen !== 'results' || !!refs.workspace.querySelector('[data-result="reading"]') && !!refs.workspace.querySelector('[data-result="quiz"]'));
    }]
  ];
  return checks.map(([key, probe]) => {
    try { return {name: T[safeLanguage][key], pass: Boolean(probe())}; }
    catch { return {name: T[safeLanguage][key], pass: false, detail: T[safeLanguage].verifyUnreadable}; }
  });
}
function showVerification() {
  refs.verificationList.replaceChildren();
  for (const result of verify()) {
    const item = node('li');
    item.dataset.pass = String(result.pass);
    item.append(node('strong', '', t(result.pass ? 'pass' : 'fail')), document.createTextNode(result.name));
    if (result.detail) item.append(node('small', '', result.detail));
    refs.verificationList.append(item);
  }
  refs.dialog.showModal();
}

// ─── Listeners ───
document.addEventListener('click', event => {
  if (event.target.closest('a.brand') && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
    event.preventDefault();
    navigate(1);
    return;
  }
  const target = event.target.closest('button');
  if (!target || target.disabled) return;
  if (target.dataset.chapterTarget) { navigate(Number(target.dataset.chapterTarget)); return; }
  if (target.dataset.langTarget) { setLanguage(target.dataset.langTarget); return; }
  if (target.hasAttribute('data-answer')) { chooseAnswer(target.closest('[data-question-id]').dataset.questionId, Number(target.dataset.answer)); return; }
  switch (target.dataset.action) {
    case 'next': navigate(Math.min(TOTAL, state.chapter + 1)); break;
    case 'prev': navigate(Math.max(1, state.chapter - 1)); break;
    case 'complete': markComplete(); break;
    case 'results': showResults(); break;
    case 'return': navigate(state.chapter); break;
    case 'open-chapter': navigate(Number(target.dataset.chapter)); break;
    case 'retry': retryChapter(); break;
    case 'reset': resetProgress(); break;
    case 'verify': showVerification(); break;
    case 'close-verification': refs.dialog.close(); break;
    case 'toggle-index': state.indexOpen = !state.indexOpen; renderNavigation(); break;
  }
});
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey || refs.dialog.open) return;
  const target = event.target instanceof Element ? event.target : document.activeElement;
  if (target?.closest('button, a, input, textarea, select, summary, [contenteditable]:not([contenteditable="false"]), [role="button"], [role="textbox"]')) return;
  if (state.screen !== 'lesson') return;
  if (event.key === 'ArrowLeft') { event.preventDefault(); navigate(Math.max(1, state.chapter - 1)); }
  else if (event.key === 'ArrowRight') { event.preventDefault(); navigate(Math.min(TOTAL, state.chapter + 1)); }
  else if (event.key === 'Enter') { event.preventDefault(); if (state.chapter === TOTAL) showResults(); else navigate(state.chapter + 1); }
  else if (/^[1-4]$/.test(event.key)) {
    const question = chapterQuestions().find(item => !Object.hasOwn(state.answers, item.id));
    if (question && Number(event.key) <= question.options) { event.preventDefault(); chooseAnswer(question.id, Number(event.key) - 1); }
  }
});
window.addEventListener('hashchange', () => {
  const chapter = hashChapter();
  if (chapter && (chapter !== state.chapter || state.screen !== 'lesson')) navigate(chapter, {updateHash: false});
});

// ─── Init ───
readSavedState();
const linkedChapter = hashChapter();
if (linkedChapter) state.chapter = linkedChapter;
window.App = {state, navigate, setLanguage, verify};
render();
</script>
